[package]
name = "agentic-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

[[bin]]
name = "summarizer"
path = "src/main.rs"

[[bin]]
name = "agent"
path = "src/agent_main.rs"

[lib]
name = "agentic_ai"
path = "src/lib.rs"
